# Publishes the npm package in javascript/ when a version tag is pushed.
#
# Uses npm Trusted Publishing (OIDC) - no npm token or repository secret. The trusted publisher
# configured on npmjs.com for the actor-debugger package is:
#   repository: apify/actor-debugger
#   workflow:   publish.yml   (this file name must match exactly, including the extension)
# Provenance attestations are generated automatically by trusted publishing, and npm requires
# package.json "repository.url" to point at this exact GitHub repository.
#
# Release flow (from the javascript/ directory):
#   npm version patch        # bumps package.json, commits, and creates the v* tag
#   git push --follow-tags

name: Publish to npm

on:
  push:
    tags:
      - 'v*'

defaults:
  run:
    working-directory: javascript

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Syntax-check sources
        run: |
          node --check bin/cli.mjs
          node --check lib/debug_server.mjs
          node --check lib/inline_sourcemaps.mjs

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi

      - name: Smoke test (entrypoint runs and its output passes through)
        run: |
          mkdir -p /tmp/smoke && cd /tmp/smoke
          echo 'console.log("smoke-ok")' > index.js
          OUTPUT="$(node "$GITHUB_WORKSPACE/javascript/bin/cli.mjs" index.js 2>&1)"
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q 'smoke-ok'

      - name: Smoke test (DevTools served over the web-server port)
        run: |
          mkdir -p /tmp/smoke-debug && cd /tmp/smoke-debug
          echo 'setTimeout(() => console.log("done"), 15000)' > index.js
          ACTOR_WEB_SERVER_PORT=4321 ACTOR_WEB_SERVER_URL=http://localhost:4321 \
            node "$GITHUB_WORKSPACE/javascript/bin/cli.mjs" index.js &
          CLI_PID=$!
          for i in $(seq 1 20); do
            sleep 0.5
            if curl -sf http://127.0.0.1:4321/json/list > /dev/null; then break; fi
          done
          curl -sf http://127.0.0.1:4321/json/list | grep -q '"id"'
          curl -sf http://127.0.0.1:4321/devtools/js_app.html > /dev/null
          kill $CLI_PID

      - name: Check pack contents
        run: npm pack --dry-run

  publish:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for npm Trusted Publishing (OIDC)
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm >= 11.5.1; make sure the runner's npm is new enough.
      - name: Update npm
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Publish (trusted publishing)
        run: npm publish
