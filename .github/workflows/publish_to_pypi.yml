# Publishes the Python package in python/ to PyPI, then tags the commit and creates the GitHub
# release. Started manually (Actions -> Publish to PyPI -> Run workflow) on master; the version it
# publishes is whatever python/pyproject.toml carries on that commit.
#
# Release flow:
#   1. Bump the version in python/pyproject.toml and python/src/actor_debugger/__init__.py in a
#      PR and merge it to master.
#   2. Actions -> Publish to PyPI -> Run workflow (branch: master).
#   The workflow refuses to run if that version is already on PyPI or its py-v* tag already
#   exists, so a re-run after a failure is safe. On success it publishes, pushes the py-vX.Y.Z tag
#   and creates a GitHub release with generated notes - never create those by hand.
#
# Uses PyPI Trusted Publishing (OIDC) - no API token or secret anywhere. The trusted publisher on
# PyPI is configured as:
#   project:    actor-debugger
#   repository: apify/actor-debugger
#   workflow:   publish_to_pypi.yml   (this file name must match exactly)

name: Publish to PyPI

on:
  workflow_dispatch:

# Never let two releases run at once (they would race on the same version/tag).
concurrency:
  group: publish-pypi
  cancel-in-progress: false

defaults:
  run:
    working-directory: python

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Refuse to publish from anything but master
        if: github.ref != 'refs/heads/master'
        run: |
          echo "Publish to PyPI must be started on master, got ${GITHUB_REF}" >&2
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Read version from pyproject.toml
        id: version
        run: |
          VERSION="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          INIT_VERSION="$(python -c "import re; print(re.search(r'__version__\s*=\s*[\"\']([^\"\']+)', open('src/actor_debugger/__init__.py').read()).group(1))")"
          if [ "$VERSION" != "$INIT_VERSION" ]; then
            echo "pyproject.toml version $VERSION does not match __init__.__version__ $INIT_VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify the version is not published yet
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Ask PyPI for the released versions (fails loudly on a network error rather than
          # silently treating the version as new).
          PUBLISHED="$(curl -sSf https://pypi.org/pypi/actor-debugger/json)"
          if python -c "import json,sys; sys.exit(0 if sys.argv[2] in json.loads(sys.argv[1])['releases'] else 1)" "$PUBLISHED" "$VERSION"; then
            echo "actor-debugger ${VERSION} is already on PyPI - bump the version first" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/py-v${VERSION}" > /dev/null; then
            echo "Tag py-v${VERSION} already exists - bump the version first" >&2
            exit 1
          fi

      - name: Install package
        run: pip install .

      - name: Smoke test (entrypoint runs and its output passes through)
        run: |
          mkdir -p /tmp/smoke && cd /tmp/smoke
          echo 'print("smoke-ok")' > main.py
          OUTPUT="$(python -m actor_debugger 2>&1)"
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q 'smoke-ok'

      - name: Smoke test (debugger UI served over the web-server port)
        run: |
          mkdir -p /tmp/smoke-debug && cd /tmp/smoke-debug
          printf 'import time\ntime.sleep(15)\n' > main.py
          ACTOR_WEB_SERVER_PORT=4321 ACTOR_WEB_SERVER_URL=http://localhost:4321 \
            python -m actor_debugger main.py &
          CLI_PID=$!
          for i in $(seq 1 30); do
            sleep 0.5
            if curl -sf http://127.0.0.1:4321/config > /dev/null; then break; fi
          done
          curl -sf http://127.0.0.1:4321/config | grep -q '"cwd"'
          curl -sf http://127.0.0.1:4321/ui/ | grep -q 'Actor Debugger'
          kill $CLI_PID

  publish:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # PyPI Trusted Publishing (OIDC)
      contents: write   # push the release tag and create the GitHub release
    env:
      VERSION: ${{ needs.check.outputs.version }}
      TAG: py-v${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history and tags, so the release notes start at the previous py-v* tag

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build distributions
        run: |
          pip install build
          python -m build

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist

      - name: Tag the release commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "actor-debugger $TAG (PyPI)"
          git push origin "$TAG"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Previous PyPI release tag (py-v*, not the npm v* tags), if any, for the notes range.
          PREV="$(git describe --tags --abbrev=0 --match 'py-v*' "${TAG}^" 2>/dev/null || true)"
          if [ -n "$PREV" ]; then
            gh release create "$TAG" --title "actor-debugger $TAG (PyPI)" --generate-notes --notes-start-tag "$PREV" --verify-tag
          else
            gh release create "$TAG" --title "actor-debugger $TAG (PyPI)" --generate-notes --verify-tag
          fi
