<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Actor Debugger</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #1e1f22; --bg2: #26282c; --bg3: #2e3136; --border: #3a3d42;
    --fg: #d6d8dc; --dim: #8b8f97; --accent: #4fa3ff; --accent2: #7bd88f;
    --pause: #e8b04b; --err: #ff6b6b; --sel: #2f4562;
    --font: 13px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: 12px/1.5 "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--fg); font: var(--font); overflow: hidden; }
  #app { display: grid; height: 100vh;
         grid-template-rows: 38px 1fr 180px;
         grid-template-columns: 230px 1fr 300px;
         grid-template-areas: "head head head" "files source side" "console console side"; }

  header { grid-area: head; display: flex; align-items: center; gap: 8px; padding: 0 10px;
           background: var(--bg2); border-bottom: 1px solid var(--border); }
  header .title { font-weight: 600; margin-right: 6px; }
  #status { display: flex; align-items: center; gap: 6px; color: var(--dim); min-width: 160px; }
  #status .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--dim); }
  #status.running .dot { background: var(--accent2); }
  #status.paused .dot { background: var(--pause); }
  #status.dead .dot { background: var(--err); }
  .btn { background: var(--bg3); color: var(--fg); border: 1px solid var(--border); border-radius: 4px;
         padding: 3px 9px; cursor: pointer; font: inherit; }
  .btn:hover:not(:disabled) { background: #383b41; }
  .btn:disabled { opacity: .38; cursor: default; }
  header label { color: var(--dim); display: flex; gap: 4px; align-items: center; margin-left: 6px; }
  header .spacer { flex: 1; }

  #files { grid-area: files; overflow: auto; background: var(--bg2); border-right: 1px solid var(--border); padding: 6px 0; }
  #files h3, #side h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
                        color: var(--dim); padding: 6px 10px 4px; }
  .file-item { padding: 2px 10px; cursor: pointer; white-space: nowrap; overflow: hidden;
               text-overflow: ellipsis; direction: rtl; text-align: left; }
  .file-item span { direction: ltr; unicode-bidi: plaintext; }
  .file-item:hover { background: var(--bg3); }
  .file-item.active { background: var(--sel); }

  #source { grid-area: source; overflow: auto; font: var(--mono); position: relative; }
  #source .placeholder { color: var(--dim); padding: 24px; font: var(--font); }
  .line { display: flex; min-height: 18px; }
  .line:hover { background: #24262a; }
  .gutter { width: 62px; flex: none; text-align: right; padding-right: 10px; color: var(--dim);
            cursor: pointer; user-select: none; border-right: 1px solid var(--border);
            background: var(--bg2); position: relative; }
  .gutter:hover { color: var(--fg); }
  .line.bp .gutter::before { content: ""; position: absolute; left: 8px; top: 4px; width: 10px; height: 10px;
                             border-radius: 50%; background: var(--err); }
  .line.bp.bp-pending .gutter::before { background: transparent; border: 1.5px solid var(--err); }
  .code { padding-left: 12px; white-space: pre; flex: 1; }
  .line.current { background: #3a3113; }
  .line.current .code { position: relative; }
  .line.frame-sel { background: #21324a; }
  .tok-kw { color: #c792ea; } .tok-str { color: #a5d6a7; } .tok-com { color: #6a737d; }
  .tok-num { color: #f78c6c; } .tok-def { color: #82aaff; }

  #side { grid-area: side; overflow: auto; background: var(--bg2); border-left: 1px solid var(--border);
          display: flex; flex-direction: column; }
  #side section { border-bottom: 1px solid var(--border); padding-bottom: 6px; }
  #stack .frame { padding: 2px 10px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #stack .frame:hover { background: var(--bg3); }
  #stack .frame.active { background: var(--sel); }
  #stack .frame .loc { color: var(--dim); font-size: 11px; }
  #vars { font: var(--mono); }
  .var-row { padding: 1px 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: default; }
  .var-row .caret { display: inline-block; width: 12px; color: var(--dim); cursor: pointer; }
  .var-name { color: var(--accent); }
  .var-val { color: var(--fg); }
  .var-type { color: var(--dim); }
  #bp-list .bp-row { padding: 2px 10px; display: flex; gap: 6px; align-items: center; }
  #bp-list .bp-row .loc { cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #bp-list .bp-row .rm { color: var(--dim); cursor: pointer; }
  #bp-list .bp-row .rm:hover { color: var(--err); }
  #exc-filters { padding: 4px 10px; color: var(--dim); display: flex; flex-direction: column; gap: 2px; }

  #console { grid-area: console; display: flex; flex-direction: column; background: #17181a;
             border-top: 1px solid var(--border); font: var(--mono); }
  #console-out { flex: 1; overflow: auto; padding: 6px 10px; }
  #console-out .entry { white-space: pre-wrap; word-break: break-word; }
  #console-out .in { color: var(--dim); }
  #console-out .res { color: var(--accent2); }
  #console-out .err { color: var(--err); }
  #console-out .info { color: var(--pause); }
  #console-in { display: flex; border-top: 1px solid var(--border); }
  #console-in .chevron { padding: 5px 4px 5px 10px; color: var(--accent); }
  #console-in input { flex: 1; background: transparent; border: 0; outline: 0; color: var(--fg);
                      font: var(--mono); padding: 5px 10px 5px 0; }
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="title">🐛 Actor Debugger</span>
    <div id="status"><span class="dot"></span><span id="status-text">connecting…</span></div>
    <button class="btn" id="b-resume" title="Resume (F8)" disabled>▶ Resume</button>
    <button class="btn" id="b-pause" title="Pause" disabled>⏸ Pause</button>
    <button class="btn" id="b-over" title="Step over (F10)" disabled>⤵ Over</button>
    <button class="btn" id="b-in" title="Step into (F11)" disabled>↓ Into</button>
    <button class="btn" id="b-out" title="Step out (Shift+F11)" disabled>↑ Out</button>
    <span class="spacer"></span>
    <label title="Applied on (re)connect"><input type="checkbox" id="just-my-code" checked> just my code</label>
    <button class="btn" id="b-reconnect">⟳ Reconnect</button>
  </header>

  <div id="files"><h3>Sources</h3><div id="file-list"></div></div>

  <div id="source"><div class="placeholder">Waiting for the debug session…<br><br>
    Set breakpoints by clicking line numbers once a file is open. Files appear on the left as the
    program loads them, or when it pauses.</div></div>

  <div id="side">
    <section id="stack-sec"><h3>Call stack</h3><div id="stack"><div class="var-row var-type" style="padding:2px 10px">not paused</div></div></section>
    <section><h3>Variables</h3><div id="vars"></div></section>
    <section><h3>Breakpoints</h3><div id="bp-list"></div>
      <div id="exc-filters">
        <label><input type="checkbox" id="exc-uncaught"> break on uncaught exceptions</label>
        <label><input type="checkbox" id="exc-raised"> break on raised exceptions</label>
      </div>
    </section>
  </div>

  <div id="console">
    <div id="console-out"></div>
    <div id="console-in"><span class="chevron">›</span>
      <input id="repl" placeholder="Evaluate in the selected frame (Enter)…" autocomplete="off"></div>
  </div>
</div>

<script>
"use strict";

/* ---------- tiny helpers ---------- */
const $ = (id) => document.getElementById(id);
const esc = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

const PY_KW = /\b(def|class|return|if|elif|else|for|while|try|except|finally|with|as|import|from|pass|break|continue|lambda|yield|await|async|raise|in|is|not|and|or|None|True|False|global|nonlocal|del|assert|match|case)\b/g;
function highlightPlain(segment) {
  return esc(segment)
    .replace(PY_KW, '<span class="tok-kw">$1</span>')
    .replace(/\b(\d+(?:\.\d+)?)\b/g, '<span class="tok-num">$1</span>');
}
function highlight(lineText) {
  // Single pass: comments and single-line strings become spans, the rest gets keyword/number
  // coloring. (Triple-quoted bodies spanning lines stay plain - fine for a debugger view.)
  const re = /(#.*)|("(?:\\.|[^"\\])*"?|'(?:\\.|[^'\\])*'?)/g;
  let out = "", last = 0, m;
  while ((m = re.exec(lineText))) {
    out += highlightPlain(lineText.slice(last, m.index));
    if (m[1] !== undefined) out += `<span class="tok-com">${esc(m[1])}</span>`;
    else out += `<span class="tok-str">${esc(m[2])}</span>`;
    last = m.index + m[0].length;
  }
  return out + highlightPlain(lineText.slice(last));
}

/* ---------- DAP client over the /dap WebSocket bridge ---------- */
class Dap {
  constructor(onEvent, onClose) {
    this.seq = 0;
    this.pending = new Map();
    this.onEvent = onEvent;
    this.onClose = onClose;
    const proto = location.protocol === "https:" ? "wss" : "ws";
    this.ws = new WebSocket(`${proto}://${location.host}/dap`);
    this.opened = new Promise((res, rej) => { this.ws.onopen = res; this.ws.onerror = rej; });
    this.ws.onmessage = (e) => this._dispatch(JSON.parse(e.data));
    this.ws.onclose = () => { this.pending.forEach((p) => p.reject(new Error("connection closed"))); this.pending.clear(); onClose(); };
  }
  _dispatch(msg) {
    if (msg.type === "response") {
      const p = this.pending.get(msg.request_seq);
      if (p) { this.pending.delete(msg.request_seq); msg.success ? p.resolve(msg.body || {}) : p.reject(new Error(msg.message || "request failed")); }
    } else if (msg.type === "event") {
      this.onEvent(msg.event, msg.body || {});
    }
  }
  request(command, args) {
    const seq = ++this.seq;
    this.ws.send(JSON.stringify({ seq, type: "request", command, ...(args ? { arguments: args } : {}) }));
    return new Promise((resolve, reject) => this.pending.set(seq, { resolve, reject }));
  }
  close() { try { this.ws.close(); } catch {} }
}

/* ---------- application state ---------- */
const state = {
  dap: null,
  config: { cwd: "/", brk: false, entryPath: "" },
  connected: false,
  paused: false,
  terminated: false,
  threadId: null,
  frames: [],
  frameIndex: 0,
  files: new Map(),          // path -> { lines, el? }
  openPath: null,
  breakpoints: new Map(),    // path -> Set(line)
  bpTemporary: null,         // {path, line} entry-stop breakpoint to auto-remove
  history: [], histIdx: 0,
  reconnectTimer: null,
};

function loadBps() {
  try {
    const raw = JSON.parse(localStorage.getItem("actor-debugger:bps") || "{}");
    for (const [p, lines] of Object.entries(raw)) state.breakpoints.set(p, new Set(lines));
  } catch {}
}
function saveBps() {
  const out = {};
  for (const [p, s] of state.breakpoints) if (s.size) out[p] = [...s];
  try { localStorage.setItem("actor-debugger:bps", JSON.stringify(out)); } catch {}
}

/* ---------- status & controls ---------- */
function setStatus(cls, text) {
  $("status").className = cls;
  $("status-text").textContent = text;
  const pausedBtns = state.connected && state.paused;
  $("b-resume").disabled = !pausedBtns;
  $("b-over").disabled = !pausedBtns;
  $("b-in").disabled = !pausedBtns;
  $("b-out").disabled = !pausedBtns;
  $("b-pause").disabled = !(state.connected && !state.paused);
}

function consoleLog(text, cls) {
  const div = document.createElement("div");
  div.className = "entry " + (cls || "");
  div.textContent = text;
  $("console-out").appendChild(div);
  $("console-out").scrollTop = $("console-out").scrollHeight;
}

/* ---------- source viewer ---------- */
async function fetchSource(path) {
  if (state.files.has(path)) return state.files.get(path);
  const res = await fetch(`/source?path=${encodeURIComponent(path)}`);
  const entry = { lines: res.ok ? (await res.text()).split("\n") : [`<< source not available: ${path} >>`] };
  state.files.set(path, entry);
  addFileToList(path);
  return entry;
}

async function openFile(path, focusLine, isCurrent) {
  const entry = await fetchSource(path);
  state.openPath = path;
  const container = $("source");
  container.innerHTML = "";
  const bps = state.breakpoints.get(path) || new Set();
  entry.lines.forEach((text, i) => {
    const n = i + 1;
    const line = document.createElement("div");
    line.className = "line" + (bps.has(n) ? " bp" : "");
    line.dataset.line = n;
    const gutter = document.createElement("div");
    gutter.className = "gutter";
    gutter.textContent = n;
    gutter.onclick = () => toggleBreakpoint(path, n);
    const code = document.createElement("div");
    code.className = "code";
    code.innerHTML = highlight(text) || "&nbsp;";
    line.append(gutter, code);
    container.appendChild(line);
  });
  document.querySelectorAll(".file-item").forEach((el) => el.classList.toggle("active", el.dataset.path === path));
  if (focusLine) markLine(focusLine, isCurrent ? "current" : "frame-sel");
}

function markLine(n, cls) {
  document.querySelectorAll(".line.current, .line.frame-sel").forEach((el) => el.classList.remove("current", "frame-sel"));
  const el = document.querySelector(`.line[data-line="${n}"]`);
  if (el) { el.classList.add(cls); el.scrollIntoView({ block: "center" }); }
}

function addFileToList(path) {
  if (document.querySelector(`.file-item[data-path="${CSS.escape(path)}"]`)) return;
  const item = document.createElement("div");
  item.className = "file-item";
  item.dataset.path = path;
  item.title = path;
  const project = path.startsWith(state.config.cwd);
  const label = project ? path.slice(state.config.cwd.length).replace(/^\//, "") : path;
  item.innerHTML = `<span>${esc(label)}</span>`;
  item.onclick = () => openFile(path);
  const list = $("file-list");
  if (project) list.prepend(item); else list.appendChild(item);
}

/* ---------- breakpoints ---------- */
async function syncBreakpoints(path) {
  const lines = [...(state.breakpoints.get(path) || [])].sort((a, b) => a - b);
  if (!state.connected) { renderBpList(); return; }
  try {
    const body = await state.dap.request("setBreakpoints", {
      source: { path },
      breakpoints: lines.map((l) => ({ line: l })),
    });
    // adopt adjusted/verified lines
    const actual = new Set();
    (body.breakpoints || []).forEach((bp) => actual.add(bp.line || 0));
    if (lines.length && actual.size) {
      state.breakpoints.set(path, new Set([...actual].filter(Boolean)));
    }
  } catch (e) {
    consoleLog(`setBreakpoints failed: ${e.message}`, "err");
  }
  saveBps();
  renderBpList();
  if (state.openPath === path) refreshGutters(path);
}

function refreshGutters(path) {
  const bps = state.breakpoints.get(path) || new Set();
  document.querySelectorAll("#source .line").forEach((el) => {
    el.classList.toggle("bp", bps.has(Number(el.dataset.line)));
  });
}

function toggleBreakpoint(path, line) {
  if (!state.breakpoints.has(path)) state.breakpoints.set(path, new Set());
  const set = state.breakpoints.get(path);
  set.has(line) ? set.delete(line) : set.add(line);
  syncBreakpoints(path);
}

function renderBpList() {
  const list = $("bp-list");
  list.innerHTML = "";
  for (const [path, lines] of state.breakpoints) {
    for (const line of [...lines].sort((a, b) => a - b)) {
      const row = document.createElement("div");
      row.className = "bp-row";
      const rm = document.createElement("span");
      rm.className = "rm"; rm.textContent = "✕";
      rm.onclick = () => toggleBreakpoint(path, line);
      const loc = document.createElement("span");
      loc.className = "loc";
      loc.textContent = `${path.split("/").pop()}:${line}`;
      loc.title = `${path}:${line}`;
      loc.onclick = () => openFile(path, line);
      row.append(rm, loc);
      list.appendChild(row);
    }
  }
}

async function syncExceptionFilters() {
  if (!state.connected) return;
  const filters = [];
  if ($("exc-uncaught").checked) filters.push("uncaught");
  if ($("exc-raised").checked) filters.push("raised");
  try { localStorage.setItem("actor-debugger:exc", JSON.stringify(filters)); } catch {}
  try { await state.dap.request("setExceptionBreakpoints", { filters }); }
  catch (e) { consoleLog(`setExceptionBreakpoints failed: ${e.message}`, "err"); }
}

/* ---------- stack & variables ---------- */
async function onStopped(body) {
  state.paused = true;
  state.threadId = body.threadId ?? state.threadId ?? 1;
  const reason = body.reason || "pause";
  setStatus("paused", `paused (${reason})`);
  if (reason === "exception") {
    try {
      const info = await state.dap.request("exceptionInfo", { threadId: state.threadId });
      consoleLog(`Exception: ${info.exceptionId || ""} ${info.description || ""}`.trim(), "err");
    } catch {}
  }
  // Remove the synthetic --brk entry breakpoint after the first stop.
  if (state.bpTemporary) {
    const { path, line } = state.bpTemporary;
    state.bpTemporary = null;
    const set = state.breakpoints.get(path);
    if (set && set.delete(line)) syncBreakpoints(path);
  }
  try {
    const st = await state.dap.request("stackTrace", { threadId: state.threadId });
    state.frames = st.stackFrames || [];
    renderStack();
    if (state.frames.length) selectFrame(0);
  } catch (e) { consoleLog(`stackTrace failed: ${e.message}`, "err"); }
}

function onContinued() {
  state.paused = false;
  state.frames = [];
  renderStack();
  $("vars").innerHTML = "";
  document.querySelectorAll(".line.current, .line.frame-sel").forEach((el) => el.classList.remove("current", "frame-sel"));
  setStatus("running", "running");
}

function renderStack() {
  const el = $("stack");
  el.innerHTML = "";
  if (!state.frames.length) {
    el.innerHTML = '<div class="var-row var-type" style="padding:2px 10px">not paused</div>';
    return;
  }
  state.frames.forEach((f, i) => {
    const row = document.createElement("div");
    row.className = "frame" + (i === state.frameIndex ? " active" : "");
    const file = f.source && f.source.path ? f.source.path.split("/").pop() : "?";
    row.innerHTML = `${esc(f.name)} <span class="loc">${esc(file)}:${f.line}</span>`;
    row.onclick = () => selectFrame(i);
    el.appendChild(row);
  });
}

async function selectFrame(index) {
  state.frameIndex = index;
  renderStack();
  const frame = state.frames[index];
  if (frame && frame.source && frame.source.path) {
    await openFile(frame.source.path, frame.line, index === 0);
  }
  $("vars").innerHTML = "";
  if (!frame) return;
  try {
    const sc = await state.dap.request("scopes", { frameId: frame.id });
    for (const scope of sc.scopes || []) {
      if (scope.expensive) continue;
      appendVarRow($("vars"), 0, scope.name, "", "", scope.variablesReference, true);
    }
  } catch (e) { consoleLog(`scopes failed: ${e.message}`, "err"); }
}

function appendVarRow(container, depth, name, value, type, ref, autoExpand) {
  const row = document.createElement("div");
  row.className = "var-row";
  row.style.paddingLeft = `${10 + depth * 14}px`;
  const caret = document.createElement("span");
  caret.className = "caret";
  caret.textContent = ref > 0 ? "▸" : "";
  row.appendChild(caret);
  const label = document.createElement("span");
  label.innerHTML = `<span class="var-name">${esc(name)}</span>` +
    (value ? `: <span class="var-val">${esc(value)}</span>` : "") +
    (type ? ` <span class="var-type">${esc(type)}</span>` : "");
  row.appendChild(label);
  container.appendChild(row);
  if (ref > 0) {
    let expanded = false, holder = null;
    const toggle = async () => {
      if (expanded) { holder.remove(); holder = null; expanded = false; caret.textContent = "▸"; return; }
      expanded = true; caret.textContent = "▾";
      holder = document.createElement("div");
      row.after(holder);
      try {
        const body = await state.dap.request("variables", { variablesReference: ref });
        for (const v of (body.variables || []).slice(0, 200)) {
          appendVarRow(holder, depth + 1, v.name, v.value, v.type || "", v.variablesReference || 0, false);
        }
      } catch (e) { consoleLog(`variables failed: ${e.message}`, "err"); }
    };
    caret.onclick = toggle;
    row.ondblclick = toggle;
    if (autoExpand) toggle();
  }
}

/* ---------- session ---------- */
async function connect() {
  clearTimeout(state.reconnectTimer);
  if (state.dap) state.dap.close();
  setStatus("", "connecting…");
  const dap = new Dap(handleEvent, handleClose);
  state.dap = dap;
  try { await dap.opened; } catch { handleClose(); return; }

  try {
    await dap.request("initialize", {
      clientID: "actor-debugger", clientName: "Actor Debugger", adapterID: "debugpy",
      pathFormat: "path", linesStartAt1: true, columnsStartAt1: true,
      supportsVariableType: true, locale: "en",
    });
    // The bridge injects the adapter's loopback `connect` address into this request.
    dap.request("attach", { justMyCode: $("just-my-code").checked }).catch(() => {});
  } catch (e) {
    consoleLog(`handshake failed: ${e.message}`, "err");
  }
}

async function handleEvent(event, body) {
  if (event === "initialized") {
    state.connected = true;
    // --brk: pause deterministically on the entry file's first executable line.
    if (state.config.brk && state.config.entryPath && !sessionStorage.getItem("adbg:entry-stop-done")) {
      sessionStorage.setItem("adbg:entry-stop-done", "1");
      const path = state.config.entryPath;
      if (!state.breakpoints.has(path)) state.breakpoints.set(path, new Set());
      if (![...state.breakpoints.values()].some((s) => s.size)) {
        state.breakpoints.get(path).add(1);
        state.bpTemporary = { path, line: 1 };
      }
    }
    await syncExceptionFilters();
    for (const path of state.breakpoints.keys()) await syncBreakpoints(path);
    await state.dap.request("configurationDone").catch(() => {});
    setStatus("running", "attached - running");
    if (state.config.entryPath) fetchSource(state.config.entryPath).then(() => {
      if (!state.openPath) openFile(state.config.entryPath);
    }).catch(() => {});
  } else if (event === "stopped") {
    onStopped(body);
  } else if (event === "continued") {
    onContinued();
  } else if (event === "output") {
    if (["stdout", "stderr", "console", "important"].includes(body.category || "console")) {
      consoleLog((body.output || "").replace(/\n$/, ""), body.category === "stderr" ? "err" : "");
    }
  } else if (event === "terminated" || event === "exited") {
    state.terminated = true;
    state.connected = false;
    setStatus("dead", "program terminated");
    consoleLog("--- program terminated ---", "info");
  } else if (event === "loadedSource") {
    if (body.source && body.source.path) addFileToList(body.source.path);
  } else if (event === "module") {
    if (body.module && body.module.path) addFileToList(body.module.path);
  }
}

function handleClose() {
  const wasConnected = state.connected;
  state.connected = false;
  state.paused = false;
  if (state.terminated) { setStatus("dead", "program terminated"); return; }
  setStatus("dead", "disconnected - retrying…");
  if (wasConnected) consoleLog("--- connection lost, reconnecting ---", "info");
  state.reconnectTimer = setTimeout(connect, 2000);
}

/* ---------- toolbar, console, keys ---------- */
function threadArg() { return { threadId: state.threadId ?? 1 }; }
$("b-resume").onclick = () => state.dap.request("continue", threadArg()).then(onContinued).catch((e) => consoleLog(e.message, "err"));
$("b-pause").onclick = () => state.dap.request("pause", threadArg()).catch((e) => consoleLog(e.message, "err"));
$("b-over").onclick = () => state.dap.request("next", threadArg()).then(onContinued).catch((e) => consoleLog(e.message, "err"));
$("b-in").onclick = () => state.dap.request("stepIn", threadArg()).then(onContinued).catch((e) => consoleLog(e.message, "err"));
$("b-out").onclick = () => state.dap.request("stepOut", threadArg()).then(onContinued).catch((e) => consoleLog(e.message, "err"));
$("b-reconnect").onclick = () => { state.terminated = false; connect(); };
$("exc-uncaught").onchange = syncExceptionFilters;
$("exc-raised").onchange = syncExceptionFilters;

document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT" && e.target.type === "text") return;
  if (e.key === "F8") { e.preventDefault(); $("b-resume").click(); }
  if (e.key === "F10") { e.preventDefault(); $("b-over").click(); }
  if (e.key === "F11" && !e.shiftKey) { e.preventDefault(); $("b-in").click(); }
  if (e.key === "F11" && e.shiftKey) { e.preventDefault(); $("b-out").click(); }
});

$("repl").addEventListener("keydown", async (e) => {
  const input = e.target;
  if (e.key === "ArrowUp") { if (state.histIdx > 0) input.value = state.history[--state.histIdx] || ""; return; }
  if (e.key === "ArrowDown") { if (state.histIdx < state.history.length) input.value = state.history[++state.histIdx] || ""; return; }
  if (e.key !== "Enter" || !input.value.trim()) return;
  const expr = input.value;
  input.value = "";
  state.history.push(expr); state.histIdx = state.history.length;
  consoleLog(`› ${expr}`, "in");
  if (!state.dap || !state.connected) { consoleLog("not connected", "err"); return; }
  const frame = state.paused ? state.frames[state.frameIndex] : null;
  try {
    const body = await state.dap.request("evaluate", {
      expression: expr, context: "repl", ...(frame ? { frameId: frame.id } : {}),
    });
    consoleLog(body.result ?? "", "res");
  } catch (err) {
    consoleLog(err.message, "err");
  }
});

/* ---------- boot ---------- */
(async () => {
  loadBps();
  try {
    const filters = JSON.parse(localStorage.getItem("actor-debugger:exc") || "[]");
    $("exc-uncaught").checked = filters.includes("uncaught");
    $("exc-raised").checked = filters.includes("raised");
  } catch {}
  try { state.config = await (await fetch("/config")).json(); } catch {}
  renderBpList();
  connect();
})();
</script>
</body>
